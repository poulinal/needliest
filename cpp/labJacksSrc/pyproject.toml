[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labjack-writer"
version = "0.1.0"
description = "Send LabJack AIN0 readings to serial for AVR"
authors = [{name="you", email="you@example.com"}]

dependencies = [
	"labjack-ljm",
	"pyserial",
]

[project.scripts]
labjack-write = "labjackWrite.main:main"

[tool.setuptools.packages.find]
where = ["labjackWrite"]